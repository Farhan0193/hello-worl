<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LC Import & Wholesale Management Software</title>
<style>
:root{--navy:#16324f;--blue:#2463a6;--bg:#f3f6fa;--line:#d9e1ea;--text:#18212b;--muted:#64748b;--red:#b42318;--green:#137547;--teal:#087e8b;--amber:#b7791f;--purple:#6b4db3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--text)}header{background:var(--navy);color:white;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}header h1{font-size:20px;margin:0}header small{opacity:.85}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 70px)}.layout.menu-closed{grid-template-columns:1fr}.layout.menu-closed nav{display:none}nav{background:#fff;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:5px}nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;color:#27384a;cursor:pointer;font-size:14px}nav button.active,nav button:hover{background:#e8f0fa;color:var(--blue);font-weight:700}main{padding:18px;min-width:0}.panel{background:#fff;border:1px solid #d6e2ef;border-top:3px solid #8bb8e8;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0b1b2a08}.panel h2{font-size:20px;margin:0 0 14px}.panel h3{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:13px;color:#475569}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:9px;font:inherit;background:white}.field textarea{min-height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #1d5594;border-radius:7px;padding:9px 13px;cursor:pointer;background:linear-gradient(180deg,#347ac0,#2463a6);color:white;font-weight:600;box-shadow:0 1px 2px #0b1b2a12}.btn.secondary{border:1px solid #c6d4e3;background:#f0f5fa;color:#24364b}.btn.danger{border:1px solid #a91f17;background:linear-gradient(180deg,#d94b42,#b42318)}.btn.green{border:1px solid #0d623a;background:linear-gradient(180deg,#20965c,#137547)}.btn.secondary{background:#e8eef5;color:#24364b}.btn.danger{background:var(--red)}.btn.green{background:var(--green)}.btn.small{padding:5px 8px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px;overflow-wrap:anywhere}.table-wrap{overflow:auto;width:100%}table{border-collapse:collapse;width:100%;font-size:13px;min-width:680px}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:#e6f0fb;color:#183e63;white-space:nowrap}tbody tr:nth-child(even){background:#f8fbff}tbody tr:hover{background:#eef6ff}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.notice{background:#fff8e6;border:1px solid #f2d48b;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px}.hidden{display:none!important}.report-head{text-align:center;margin:8px 0 18px}.report-head h2{margin:3px}.report-head{border-bottom:2px solid #d6e7f8;padding-bottom:10px}.actions .btn:focus,.field input:focus,.field select:focus{outline:2px solid #9bc5f1;outline-offset:1px}.pill{display:inline-block;border-radius:20px;padding:3px 8px;background:#e9f7ef;color:var(--green);font-size:12px}.pill.neg{background:#fff0ef;color:var(--red)}footer{font-size:12px;color:var(--muted);padding:10px 0}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header h1{font-size:17px}}@media print{@page{size:A4;margin:12mm}html,body{background:#fff!important;font-size:11px;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}header,nav,.no-print,.notice,footer{display:none!important}.layout{display:block!important;background:#fff!important}.main-title-panel,.entry-panel,.filter-panel{display:none!important}main{padding:0!important}.panel{border:0!important;box-shadow:none!important;padding:0!important;margin:0 0 12px!important;background:#fff!important}.print-only{display:block!important}table{font-size:10px;min-width:0;border-collapse:collapse!important;width:100%!important}thead{display:table-header-group}tr{break-inside:avoid;page-break-inside:avoid}th,td{padding:6px;border:1px solid #9bb6d1!important}th{background:#dbeafe!important;color:#16324f!important;font-weight:700!important}tbody tr:nth-child(even){background:#f1f7ff!important}tbody tr:nth-child(odd){background:#fff!important}.report-head{margin-top:0;border-bottom:3px solid #2463a6!important;padding-bottom:10px!important;color:#16324f!important}.report-head h2{color:#16324f!important}.stat{border:1px solid #9bb6d1!important;background:#eef6ff!important}.pill{background:#e1f5e8!important;color:#137547!important}.btn{box-shadow:none!important}.grid{gap:8px}}

/* Refined colourful report and screen styling */
.statement-head{background:linear-gradient(120deg,#e8f4ff,#f4fbff);border:1px solid #b9d8f2;border-radius:10px;padding:16px!important;margin:0 0 12px!important}
.statement-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0;padding:10px;background:#f0f7ff;border:1px solid #c9def2;border-radius:9px;font-size:13px;line-height:1.9}
.summary-box{background:linear-gradient(135deg,#e4f8f2,#f4fffb);border:1px solid #a9dfcf;border-radius:9px;padding:8px 10px;color:#145b49}.summary-box small{display:block;color:#397767}.summary-box strong{display:block;font-size:16px}.summary-box.final{background:linear-gradient(135deg,#e4f7ed,#f5fff8);border-color:#8bd1a9;color:#12613a}
.statement-totals{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:14px;padding:12px;background:#edf5ff;border:1px solid #bdd5ee;border-radius:8px;color:#183e63}
.balance-sheet-head{text-align:center;padding:12px 8px 14px;margin-bottom:12px;border-bottom:3px solid #3277b8;color:#183e63;line-height:1.65}.balance-sheet-head h2{margin:0;font-size:22px;color:#163e65}.balance-sheet-head h3{margin:10px 0 2px;color:#244f78}.balance-sheet-head small{color:#60758b}
#main .panel:not(.no-print){border-top-color:#73aee3}
@media print{.statement-head{background:#e8f4ff!important;border:1px solid #8db8df!important}.statement-meta{background:#eff7ff!important;border:1px solid #9dbfe0!important;grid-template-columns:repeat(3,minmax(0,1fr))!important}.summary-box{background:#e4f8f2!important;border:1px solid #8bcdb8!important}.summary-box.final{background:#e4f7ed!important}.statement-totals{background:#edf5ff!important;border:1px solid #9dbfe0!important}.balance-sheet-head{border-bottom:3px solid #2463a6!important}.balance-sheet-head h2,.balance-sheet-head h3{color:#163e63!important}th{background:#1f5f91!important;color:#fff!important}tbody tr:nth-child(even){background:#eaf3fc!important}tbody tr:nth-child(odd){background:#fff!important}td{border-color:#b8cde0!important}.panel{background:#fff!important}}
@media(max-width:700px){.statement-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* v7 statement print layout */
.holder-bank small{display:block;color:#64748b;font-size:11px;margin-top:3px}
.balance-cell{font-weight:700;color:#145b49}
@media print{
 #printArea .summary-box.opening,#printArea .summary-box.final{display:none!important}
 @page{size:A4 landscape;margin:9mm}
 #printArea{width:100%!important;max-width:100%!important;overflow:visible!important;break-inside:auto!important;page-break-inside:auto!important}
 #printArea .table-wrap{overflow:visible!important;width:100%!important}
 #printArea table{width:100%!important;min-width:0!important;table-layout:auto!important;font-size:9.5px!important}
 #printArea th,#printArea td{padding:5px 6px!important;white-space:normal!important}
 #printArea .statement-head{margin-bottom:7px!important;padding:9px!important}
 #printArea .statement-head h2{font-size:17px!important;margin:2px!important}
 #printArea .statement-meta{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;margin:7px 0!important;padding:7px!important;font-size:10px!important}
 #printArea .summary-box{padding:5px 7px!important}
 #printArea .summary-box strong{font-size:12px!important}
 #printArea .statement-totals{margin-top:7px!important;padding:7px!important;break-inside:avoid!important}
 #printArea tr{break-inside:avoid!important;page-break-inside:avoid!important}
 #printArea thead{display:table-header-group!important}
}
</style>
</head>
<body>
<header><div style="display:flex;align-items:center;gap:12px"><button class="btn secondary" id="menuToggle" type="button" aria-expanded="false">☰ মেনু</button><div><h1 id="appTitle">LC Import & Wholesale Management Software</h1><small>অফলাইন হিসাব ব্যবস্থাপনা</small></div></div><div id="companyTop">কোম্পানির নাম সেটিংস থেকে দিন</div></header>
<div class="layout menu-closed" id="appLayout"><nav id="nav"></nav><main id="main"></main></div>
<script>
(()=>{'use strict';
const KEY='lc_wholesale_v1';
const defaults={version:1,settings:{companyName:'',contact:'',gmail:'',address:'',other:''},banks:[],holders:[],bankTx:[],cash:[],expenses:[],sales:[],stock:[],lc:[],otherLedger:[]};
let db=load(),section='Dashboard',editing=null,report=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&x.version===1?{...structuredClone(defaults),...x}:structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('ডেটা সংরক্ষণ করা যায়নি। Browser storage পূর্ণ হতে পারে। এখনই JSON Backup নিন।');return false}}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0);
const navItems=['Dashboard','Cash Book','Bank Accounts','Bank Transactions','Sales','Stock / Godown Stock','LC Records','Account Holder Ledger','All Banks Balance Sheet','Bank Statement','Reports','Backup & Restore','Company Settings'];
function renderNav(){$('nav').innerHTML=navItems.map(n=>`<button class="${n===section?'active':''}" data-nav="${esc(n)}">${esc(n)}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{section=b.dataset.nav;editing=null;report=null;render()})}
function mainTitle(){return `<div class="panel main-title-panel no-print"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>${esc(section)}</h2><button class="btn secondary" id="printTopBtn" type="button">🖨 Print / Save PDF</button></div></div>`}
function field(label,name,type='text',value='',opts=null,required=false){let control;if(opts)control=`<select name="${name}" ${required?'required':''}><option value="">-- নির্বাচন করুন --</option>${opts.map(o=>`<option value="${esc(o.value)}" ${String(value)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea name="${name}">${esc(value)}</textarea>`;else control=`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'step="0.01"':''}>`;return `<div class="field"><label>${esc(label)}${required?' *':''}</label>${control}</div>`}
function form(title,fields,button='সংরক্ষণ করুন'){return `<div class="panel entry-panel"><h3>${title}</h3><form id="entryForm"><div class="grid">${fields.join('')}</div><div class="actions"><button class="btn" type="submit">${button}</button><button class="btn secondary" type="button" id="cancelEdit">ফর্ম খালি করুন</button></div></form></div>`}
function table(headers,rows){if(!rows.length)return `<div class="empty">এখনও কোনো তথ্য নেই। নতুন Entry যোগ করুন।</div>`;return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function ops(type,id){return `<td class="no-print"><button class="btn small secondary" data-edit="${type}:${id}">Edit</button> <button class="btn small danger" data-del="${type}:${id}">Delete</button></td>`}
function wireOps(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del));document.querySelectorAll('[data-open-holder]').forEach(b=>b.onclick=()=>{section='Account Holder Ledger';report={holder:b.dataset.openHolder};render()});}
function sortedTx(){return [...db.bankTx].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created)}
function accountTx(bankId){return sortedTx().filter(t=>t.bankId===bankId)}
function bankBalance(bankId,until=null){const b=db.banks.find(x=>x.id===bankId);let bal=Number(b?.opening||0);for(const t of accountTx(bankId)){if(until&&t.date>until)continue;bal+=Number(t.credit||0)-Number(t.debit||0)}return bal}
function recalc(){/* Running balance is derived from opening balance and stable date/entry order; no stored stale balances. */ save()}
function bankLabel(id){let b=db.banks.find(x=>x.id===id);return b?b.name+' ('+b.accountNo+')':'অজানা ব্যাংক'}
function holderLabel(id){return db.holders.find(x=>x.id===id)?.name||'নির্ধারিত নয়'}
function dashboard(){let bal=sum(db.banks,b=>bankBalance(b.id));return `<div class="stats"><div class="stat"><small>মোট ব্যাংক ব্যালেন্স</small><strong>৳ ${money(bal)}</strong></div><div class="stat"><small>ব্যাংক অ্যাকাউন্ট</small><strong>${db.banks.length}</strong></div><div class="stat"><small>ব্যাংক Transaction</small><strong>${db.bankTx.length}</strong></div><div class="stat"><small>স্টক আইটেম</small><strong>${db.stock.length}</strong></div></div><div class="panel" style="margin-top:15px"><h3>ব্যাংক ব্যালেন্স সারাংশ</h3>${table(['Bank','Account Holder','Account Number','Opening Balance','Final Balance'],db.banks.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(holderLabel(b.holderId))}</td><td>${esc(b.accountNo)}</td><td class="num">${money(b.opening)}</td><td class="num">${money(bankBalance(b.id))}</td></tr>`))}</div><div class="notice">ডেটা এই Browser/Device-এ সংরক্ষিত। Browser-এর Data Clear হলে তথ্য হারাতে পারে। নিয়মিত JSON Backup ডাউনলোড করুন।</div>`}
function bankAccountSection(){let x=editing?.type==='bank'?db.banks.find(a=>a.id===editing.id):{};return form('Bank Account Entry',[field('Bank Name','name','text',x.name||'',null,true),field('Account Number','accountNo','text',x.accountNo||'',null,true),field('Routing Number','routingNo','text',x.routingNo||''),field('Account Holder','holderId','text',x.holderId||'',db.holders.map(h=>({value:h.id,label:h.name}))),field('Opening Balance','opening','number',x.opening??0),field('Branch','branch','text',x.branch||''),field('Remarks','remarks','text',x.remarks||'')])+`<div class="panel"><h3>ব্যাংক অ্যাকাউন্ট তালিকা</h3>${table(['Bank','Account Holder','Account Number','Routing Number','Opening Balance','Current Balance','Actions'],db.banks.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(holderLabel(b.holderId))}</td><td>${esc(b.accountNo)}</td><td>${esc(b.routingNo||'')}</td><td class="num">${money(b.opening)}</td><td class="num">${money(bankBalance(b.id))}</td>${ops('bank',b.id)}</tr>`))}</div>`}
function txSection(){let x=editing?.type==='tx'?db.bankTx.find(a=>a.id===editing.id):{};return form('Bank Transaction Entry',[field('তারিখ','date','date',x.date||today(),null,true),field('Bank Account','bankId','text',x.bankId||'',db.banks.map(b=>({value:b.id,label:b.name+' — '+b.accountNo})),true),field('Account Holder','holderId','text',x.holderId||'',db.holders.map(h=>({value:h.id,label:h.name}))),field('Transaction Type','kind','text',x.kind||'Deposit',[{value:'Deposit',label:'Deposit / জমা'},{value:'Withdraw',label:'Withdraw / উত্তোলন'}],true),field('Debit Amount','debit','number',x.debit??0),field('Credit Amount','credit','number',x.credit??0),field('Company Name','company','text',x.company||db.settings.companyName),field('Remarks','remarks','text',x.remarks||'')])+`<div class="panel"><h3>Transaction তালিকা</h3>${table(['Date','Bank','Account Holder','Type','Debit','Credit','Running Balance','<span class="no-print">Actions</span>'],sortedTx().map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(bankLabel(t.bankId))}</td><td>${esc(holderLabel(t.holderId||db.banks.find(b=>b.id===t.bankId)?.holderId))}</td><td>${esc(t.kind)}</td><td class="num">${money(t.debit)}</td><td class="num">${money(t.credit)}</td><td class="num">${money(runningFor(t))}</td>${ops('tx',t.id)}</tr>`))}</div>`}
function runningFor(t){let b=db.banks.find(x=>x.id===t.bankId);let bal=Number(b?.opening||0);for(const z of accountTx(t.bankId)){bal+=Number(z.credit||0)-Number(z.debit||0);if(z.id===t.id)return bal}return bal}
function holderSection(){let x=editing?.type==='holder'?db.holders.find(a=>a.id===editing.id):{};return form('Account Holder যোগ করুন',[field('Account Holder Name','name','text',x.name||'',null,true),field('Phone','phone','text',x.phone||''),field('Address','address','text',x.address||''),field('Nature','nature','text',x.nature||'Other',[{value:'Receivable',label:'Receivable / পাওনা'},{value:'Payable',label:'Payable / দেনা'},{value:'Advance',label:'Advance / অগ্রিম'},{value:'Settled',label:'Settled / সমন্বিত'},{value:'Other',label:'Other Balance'}])])+`<div class="panel"><h3>Account Holder তালিকা</h3>${table(['Name','Phone','Address','Nature','Actions'],db.holders.map(h=>`<tr><td>${esc(h.name)}</td><td>${esc(h.phone)}</td><td>${esc(h.address)}</td><td>${esc(h.nature)}</td>${ops('holder',h.id)}</tr>`))}</div>`}
function simpleSection(type,title,fields,headers,mapper){let x=editing?.type===type?db[type].find(a=>a.id===editing.id):{};return form(title,fields(x))+`<div class="panel"><h3>সংরক্ষিত তথ্য</h3>${table(headers,db[type].map(a=>`<tr>${mapper(a)}${ops(type,a.id)}</tr>`))}</div>`}
function cashSection(){return simpleSection('cash','Cash Book Entry',x=>[field('Date','date','date',x.date||today(),null,true),field('Type','kind','text',x.kind||'Receipt',[{value:'Receipt',label:'Receipt / জমা'},{value:'Payment',label:'Payment / প্রদান'}],true),field('Particulars','particulars','text',x.particulars||'',null,true),field('Debit / Payment','debit','number',x.debit??0),field('Credit / Receipt','credit','number',x.credit??0),field('Voucher','ref','text',x.ref||''),field('Remarks','remarks','text',x.remarks||'')],['Date','Type','Particulars','Debit','Credit','Balance','Actions'],a=>`<td>${esc(a.date)}</td><td>${esc(a.kind)}</td><td>${esc(a.particulars)}</td><td class="num">${money(a.debit)}</td><td class="num">${money(a.credit)}</td><td class="num">${money(sum(db.cash.filter(c=>c.date<=a.date&& (c.date<a.date||c.created<=a.created)),c=>c.credit)-sum(db.cash.filter(c=>c.date<=a.date&& (c.date<a.date||c.created<=a.created)),c=>c.debit))}</td>`)}
function expenseSection(){return simpleSection('expenses','Expense Entry',x=>[field('Date','date','date',x.date||today(),null,true),field('Category','category','text',x.category||'',null,true),field('Amount','amount','number',x.amount??'',null,true),field('Paid From','paidFrom','text',x.paidFrom||'Cash'),field('Particulars','particulars','text',x.particulars||'',null,true),field('Voucher','ref','text',x.ref||'')],['Date','Category','Amount','Paid From','Particulars','Voucher','Actions'],a=>`<td>${esc(a.date)}</td><td>${esc(a.category)}</td><td class="num">${money(a.amount)}</td><td>${esc(a.paidFrom)}</td><td>${esc(a.particulars)}</td><td>${esc(a.ref)}</td>`)}
function salesSection(){return simpleSection('sales','Sales Entry',x=>[field('Date','date','date',x.date||today(),null,true),field('Customer Name','customer','text',x.customer||'',null,true),field('Item / Description','item','text',x.item||'',null,true),field('Quantity','qty','number',x.qty??1,null,true),field('Unit Price','unitPrice','number',x.unitPrice??0,null,true),field('Total Amount','amount','number',x.amount??0)],['Date','Customer','Item / Description','Quantity','Unit Price','Total Amount','Actions'],a=>`<td>${esc(a.date)}</td><td>${esc(a.customer)}</td><td>${esc(a.item)}</td><td class="num">${money(a.qty)}</td><td class="num">${money(a.unitPrice)}</td><td class="num">${money(a.amount)}</td>`)}

function del(key){let [type,id]=key.split(':');if(!confirm('এই তথ্য Delete করবেন? Delete করার আগে JSON Backup নেওয়ার পরামর্শ দেওয়া হচ্ছে।'))return;let k=type==='bank'?'banks':type==='tx'?'bankTx':type==='holder'?'holders':type; if(type==='bank'&&db.bankTx.some(t=>t.bankId===id)){alert('এই ব্যাংকে Transaction আছে। আগে সংশ্লিষ্ট Transaction মুছুন বা অন্য ব্যাংকে পরিবর্তন করুন।');return}db[k]=db[k].filter(x=>x.id!==id);save();render()}
function wireControls(){const on=(id,fn)=>{let e=$(id);if(e)e.onclick=fn};on('menuToggle',()=>{let l=$('appLayout'),b=$('menuToggle');l.classList.toggle('menu-closed');b.setAttribute('aria-expanded',String(!l.classList.contains('menu-closed')))});on('printBtn',()=>window.print());on('printTopBtn',()=>window.print());on('applyReport',()=>{report={bankId:$('rBank').value,holderId:$('rHolder').value,from:$('rFrom').value,to:$('rTo').value};render()});on('applyAll',()=>{report={bankId:$('abBank').value,holderId:$('abHolder').value,from:$('abFrom').value,to:$('abTo').value};render()});on('applyLedger',()=>{report={holder:$('ledgerHolder').value};render()});on('goStatement',()=>{section='Bank Statement';report=null;render()});on('goAllBanks',()=>{section='All Banks Balance Sheet';report=null;render()});on('goLedger',()=>{section='Account Holder Ledger';report=null;render()});on('backupBtn',downloadBackup);let rf=$('restoreFile');if(rf)rf.onchange=restoreBackup}
function downloadBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LC_Import_Wholesale_Backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);alert('JSON Backup ডাউনলোড শুরু হয়েছে।')}
function restoreBackup(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);let keys=['settings','banks','holders','bankTx','cash','expenses','sales','stock','lc','otherLedger'];if(!x||x.version!==1||!x.settings||keys.some(k=>k!=='settings'&&k!=='sales'&&!Array.isArray(x[k]))||!['companyName','contact','gmail','address','other'].every(k=>typeof x.settings[k]==='string'))throw Error('Backup structure invalid');if(x.bankTx.some(t=>!t.id||!t.bankId||!Number.isFinite(Number(t.debit))||!Number.isFinite(Number(t.credit))))throw Error('Bank transaction data invalid');if(!confirm('Restore করলে বর্তমান ডেটা প্রতিস্থাপিত হবে। আগে বর্তমান JSON Backup নিয়েছেন কি? Restore করবেন?'))return;db={...structuredClone(defaults),...x,sales:Array.isArray(x.sales)?x.sales:[]};save();editing=null;report=null;render();alert('Backup Restore সফল হয়েছে।')}catch(err){alert('Restore করা যায়নি: ভুল বা অসম্পূর্ণ JSON Backup। '+err.message)}finally{e.target.value=''}};reader.readAsText(file)}
// Print action buttons are kept out of printed output via print CSS.
render();
})();
</script></body></html>
